<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syncify</title>
    <script>
      // Anti-FOUC: fija el tema guardado antes del primer paint (default: camaleon).
      try {
        var t = localStorage.getItem("syncify.theme");
        var validos = ["camaleon", "tinta", "consola", "riso"];
        document.documentElement.dataset.theme = validos.indexOf(t) >= 0 ? t : "camaleon";
      } catch (e) {
        document.documentElement.dataset.theme = "camaleon";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
