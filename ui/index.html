<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syncify</title>
    <script>
      // Anti-FOUC: el primer frame usa el mismo default que useTheme (tinta).
      try {
        var t = localStorage.getItem("syncify.theme");
        var validos = ["tinta", "camaleon", "consola", "riso", "spotify", "apple_music", "tidal", "qobuz", "deezer", "soundcloud"];
        document.documentElement.dataset.theme = validos.indexOf(t) >= 0 ? t : "tinta";
      } catch (e) {
        document.documentElement.dataset.theme = "tinta";
      }
    </script>
    <!-- Tipografías e iconos self-hosted: ui/src/styles/fonts.css + ui/public/fonts/.
         Sin <link> a Google Fonts: la app se ve igual offline y en redes que las bloquean. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
