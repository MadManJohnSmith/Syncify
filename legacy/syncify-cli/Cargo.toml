[package]
name = "syncify-cli"
version = "0.1.0"
edition = "2021"
description = "Syncify CLI and experimental prototyping package"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
lofty = "0.18"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

[[bin]]
name = "syncify-cli"
path = "src/bin/syncify_cli.rs"

[[bin]]
name = "qobuz_url_downloader"
path = "src/bin/qobuz_url_downloader.rs"
