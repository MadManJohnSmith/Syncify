[package]
name = "syncify-cli"
version = "0.1.0"
edition = "2021"
description = "Syncify CLI and experimental prototyping package"
autobins = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
lofty = "0.18"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
metaflac = "0.2"
md5 = "0.8.0"
lazy_static = "1.5"
syncify_tauri_lib = { package = "syncify-tauri", path = "../../src-tauri" }



