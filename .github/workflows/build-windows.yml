name: Build Windows (Installer & Portable)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '¿Publicar automáticamente como Release en GitHub?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag de la release (ej: v0.1.0)'
        required: false
        type: string
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Syncify para Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configurar Python 3.11 (Host CI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar toolchain Rust estable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de artefactos Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Descargar FFmpeg y Chromaprint (fpcalc) preempaquetados
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bin"

          Write-Host ">>> Descargando FFmpeg (win64)..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffmpegExe) { Copy-Item $ffmpegExe.FullName -Destination "bin/ffmpeg.exe" -Force }
          if ($ffprobeExe) { Copy-Item $ffprobeExe.FullName -Destination "bin/ffprobe.exe" -Force }
          Remove-Item -Recurse -Force "ffmpeg-temp", "ffmpeg.zip"

          Write-Host ">>> Descargando Chromaprint fpcalc..."
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip" -OutFile "fpcalc.zip"
          Expand-Archive -Path "fpcalc.zip" -DestinationPath "fpcalc-temp"
          $fpcalcExe = Get-ChildItem -Path "fpcalc-temp" -Recurse -Filter "fpcalc.exe" | Select-Object -First 1
          if ($fpcalcExe) { Copy-Item $fpcalcExe.FullName -Destination "bin/fpcalc.exe" -Force }
          Remove-Item -Recurse -Force "fpcalc-temp", "fpcalc.zip"

          Write-Host ">>> Binarios en bin/:"
          Get-ChildItem -Path "bin"

      - name: Preparar entorno Python embebido autónomo
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "python"

          Write-Host ">>> Descargando Python 3.11 embebido para Windows..."
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "python" -Force
          Remove-Item -Force "python-embed.zip"

          # Habilitar site-packages descomentando "import site" en python311._pth
          $pthFile = Get-ChildItem -Path "python" -Filter "*._pth" | Select-Object -First 1
          if ($pthFile) {
            (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
          }

          Write-Host ">>> Instalando pip en entorno embebido..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "python/get-pip.py"
          & "python/python.exe" "python/get-pip.py" --no-warn-script-location
          Remove-Item -Force "python/get-pip.py"

          Write-Host ">>> Instalando dependencias de scripts/requirements.txt..."
          & "python/python.exe" -m pip install -r "scripts/requirements.txt" --no-warn-script-location

          Write-Host ">>> Verificando modulos criticos en Python embebido..."
          & "python/python.exe" -c "import spotipy, acoustid, fuzzywuzzy, dotenv, requests, mutagen; print('TODOS LOS MODULOS PYTHON ESTAN LISTOS!')"

      - name: Instalar dependencias de UI
        working-directory: ui
        run: npm ci

      - name: Compilar Frontend (Vue 3 / Vite)
        working-directory: ui
        run: npm run build

      - name: Compilar con Tauri v2 (Instalador NSIS y Binarios)
        run: npx --prefix ui tauri build

      - name: Preparar versión Portable y organizar artefactos
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer"
          New-Item -ItemType Directory -Force -Path "dist/portable/Syncify-Portable"

          # 1. Copiar instalador NSIS (.exe)
          $nsisInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisInstaller) {
            Write-Host "Instalador NSIS encontrado: $($nsisInstaller.FullName)"
            Copy-Item $nsisInstaller.FullName -Destination "dist/installer/"
          } else {
            Write-Warning "No se encontro el instalador NSIS en src-tauri/target/release/bundle/nsis/"
          }

          # 2. Copiar ejecutable para la versión Portable
          if (Test-Path "src-tauri/target/release/Syncify.exe") {
            Copy-Item "src-tauri/target/release/Syncify.exe" -Destination "dist/portable/Syncify-Portable/Syncify.exe"
          } elseif (Test-Path "src-tauri/target/release/syncify-tauri.exe") {
            Copy-Item "src-tauri/target/release/syncify-tauri.exe" -Destination "dist/portable/Syncify-Portable/Syncify.exe"
          } else {
            throw "No se encontro el ejecutable en src-tauri/target/release/"
          }

          # 3. Copiar scripts requeridos por Syncify
          if (Test-Path "scripts") {
            Copy-Item -Path "scripts" -Destination "dist/portable/Syncify-Portable/scripts" -Recurse -Exclude "__pycache__",".browser_profile*"
          }

          # 4. Copiar binarios auxiliares (FFmpeg y fpcalc) al portable
          if (Test-Path "bin") {
            Copy-Item -Path "bin" -Destination "dist/portable/Syncify-Portable/bin" -Recurse
          }

          # 5. Copiar entorno Python autónomo al portable
          if (Test-Path "python") {
            Copy-Item -Path "python" -Destination "dist/portable/Syncify-Portable/python" -Recurse
          }

          # 6. Descargar bootstrapper de WebView2 por si se ejecuta en Windows debloated sin WebView2
          Write-Host ">>> Descargando instalador WebView2 de soporte..."
          try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "dist/portable/Syncify-Portable/instalar_webview2_si_falla.exe"
          } catch {
            Write-Warning "No se pudo descargar el instalador opcional de WebView2"
          }

          # 7. Crear archivo LEEME en el portable
          $readmeLines = @(
            "======================================================",
            "                 SYNCIFY PORTABLE (Windows)           ",
            "======================================================",
            "",
            "1. INICIO RAPIDO:",
            "   Haz doble clic en Syncify.exe para iniciar la aplicacion.",
            "",
            "2. WINDOWS MODIFICADO O SIN EDGE / WEBVIEW2:",
            "   Syncify utiliza WebView2 para la interfaz.",
            "   Si al abrir Syncify.exe indica que falta WebView2,",
            "   ejecuta 'instalar_webview2_si_falla.exe' una sola vez.",
            "",
            "3. TODO ESTA PRE-CONFIGURADO:",
            "   - FFmpeg y Chromaprint fpcalc listos en bin/",
            "   - Python 3.11 y librerias listos en python/",
            "   - No requiere instalar dependencias adicionales.",
            "",
            "Disfruta de Syncify!",
            "======================================================"
          )
          $readmeLines | Set-Content -Path "dist/portable/Syncify-Portable/LEEME.txt" -Encoding utf8

          # 8. Comprimir versión Portable en formato .zip
          Compress-Archive -Path "dist/portable/Syncify-Portable/*" -DestinationPath "dist/portable/Syncify-Windows-Portable.zip" -Force
          Write-Host "Version Portable comprimida con exito en dist/portable/Syncify-Windows-Portable.zip"

      - name: Subir Instalador NSIS como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Syncify-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Subir Versión Portable (.zip) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Syncify-Windows-Portable
          path: dist/portable/Syncify-Windows-Portable.zip
          if-no-files-found: error

      - name: Crear Release en GitHub (Opcional)
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Syncify ${{ inputs.release_tag }}"
          draft: false
          prerelease: false
          files: |
            dist/installer/*.exe
            dist/portable/Syncify-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
