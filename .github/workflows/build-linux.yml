name: Build Linux (AppImage & DEB)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '¿Publicar automáticamente como Release en GitHub?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag de la release (ej: v0.1.0)'
        required: false
        type: string
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # No se compila ni se publica nada hasta que la puerta confirme que el
  # commit tiene CI verde y que el tag no se esta moviendo.
  gate:
    name: Verificar CI verde y tag publicable
    uses: ./.github/workflows/release-gate.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      create_release: ${{ inputs.create_release }}

  build-linux:
    name: Compilar Syncify para Linux
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (GTK, WebKit2GTK, dev tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg \
            libchromaprint-tools \
            python3-pip \
            python3-venv

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configurar toolchain Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de artefactos Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Binarios estáticos que viajan dentro del DEB/AppImage (bundle.externalBin):
      # el usuario no instala ni configura ffmpeg/fpcalc. Builds pineadas por
      # fecha (BtbN) y por versión (Chromaprint), con SHA-256 verificado.
      - name: Descargar binarios externos (ffmpeg, ffprobe, fpcalc)
        run: |
          mkdir -p src-tauri/binaries
          curl -sL -o /tmp/ffmpeg-linux.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-01-13-06/ffmpeg-N-127054-g9d3f0f2c58-linux64-gpl.tar.xz"
          echo "4ec801cb048f2ec81ac3b06507fda2f6b48f70c46286e89a27cd89baa041605d  /tmp/ffmpeg-linux.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg-linux.tar.xz -C /tmp
          cp /tmp/ffmpeg-N-127054-g9d3f0f2c58-linux64-gpl/bin/ffmpeg  src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp /tmp/ffmpeg-N-127054-g9d3f0f2c58-linux64-gpl/bin/ffprobe src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          curl -sL -o /tmp/fpcalc.tar.gz \
            "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-linux-x86_64.tar.gz"
          echo "4d7433a7f778e5946d7225230681cbcd634e153316ecac87c538c33ac32387a5  /tmp/fpcalc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fpcalc.tar.gz -C /tmp
          cp /tmp/chromaprint-fpcalc-1.5.1-linux-x86_64/fpcalc src-tauri/binaries/fpcalc-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
          ls -la src-tauri/binaries/

      - name: Instalar dependencias de UI
        working-directory: ui
        run: npm ci

      - name: Compilar Frontend (Vue 3 / Vite)
        working-directory: ui
        run: npm run build

      - name: Compilar con Tauri v2 (DEB y AppImage)
        run: npx --prefix ui tauri build

      # WebKitGTK delega la reproducción HTML5 a GStreamer. El AppImage
      # empaqueta las librerías (linuxdeploy las arrastra por dependencia de
      # webkit2gtk) pero NINGÚN plugin: sin /usr/lib/gstreamer-1.0 no existe
      # autoaudiosink y la reproducción falla con
      # "GStreamer element autoaudiosink not found. Please install it".
      # Se añaden los plugins mínimos de audio y vídeo al AppImage.
      # autoaudiosink/autovideosink viven en gst-plugins-good, que NO viene
      # instalado en los runners: sin él el paso siguiente no encuentra nada
      # que copiar (primera iteración empaquetó 13 plugins y ninguno de sink).
      - name: Instalar plugins de GStreamer (gst-plugins-good/base)
        run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-plugins-good gstreamer1.0-plugins-base
          # Sin este paso el runner no trae autoaudiosink/autovideosink y el
          # AppImage se publica sin salida de audio. Sin `|| true`: si la
          # instalación falla hay que verlo, no seguir en silencio.
          #
          # `dpkg -L` dice la RUTA REAL de cada plugin en vez de suponerla: el
          # runner can place it in /usr/lib/x86_64-linux-gnu or in
          # /usr/lib/gstreamer-1.0 según la imagen.
          echo "--- autoaudiosink/autovideosink instalados ---"
          dpkg -L gstreamer1.0-plugins-good 2>/dev/null \
            | grep -E 'libgstauto(audio|video)sink\.so$' \
            || { echo "::error::autoaudiosink/autovideosink NO instalados"; exit 1; }

      - name: Inyectar plugins de GStreamer en el AppImage
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          WORK="$(mktemp -d)"
          APPIMAGE_ABS="$PWD/$APPIMAGE"
          (
            cd "$WORK"
            "$APPIMAGE_ABS" --appimage-extract >/dev/null
          )
          PLUGDIR="$WORK/squashfs-root/usr/lib/gstreamer-1.0"
          mkdir -p "$PLUGDIR"
          WANTED='autoaudiosink alsasink pulsesink pipewiresink ossink jackaudiosink \
                  autoaudiosrc avdec_aac avdec_flac avdec_mp4 avdec_vorbis \
                  audioconvert audioresample audioparsers audiotestsrc audiorate \
                  playback typefindfunctions decodebin playbin videoconvert \
                  videoconvertscale videorate videoparsersbad videoscale \
                  autovideosink ximagesink waylandsink glimagesink fakesink \
                  coreelements coretracers'
          found=0
          for p in $WANTED; do
            # `dpkg -L` es la fuente de verdad de dónde instaló cada plugin;
            # suponer la ruta fue lo que hizo que este paso copiasen 13 plugins
            # sin ninguno de los sinks en la iteración anterior.
            src=$(dpkg -S "libgst${p}.so" 2>/dev/null | cut -d: -f1 | head -1 || true)
            if [ -n "$src" ]; then
              real=$(dpkg -L "$src" 2>/dev/null | grep -E "/libgst${p}\.so$" | head -1 || true)
            else
              real=""
            fi
            if [ -n "$real" ] && [ -f "$real" ]; then
              cp -a "$real" "$PLUGDIR/"
              found=$((found + 1))
            fi
          done
          echo "Plugins de GStreamer copiados: $found"
          # El sink de audio es IMPRESCINDIBLE: sin él el AppImage arranca pero
          # no reproduce sonido. Publicar un paquete roto es peor que fallar.
          if [ ! -f "$PLUGDIR/libgstautoaudiosink.so" ]; then
            echo "::error::autoaudiosink no está disponible en el runner; el AppImage no tendrá salida de audio"
            exit 1
          fi
          if [ ! -f "$PLUGDIR/libgstautovideosink.so" ]; then
            echo "::error::autovideosink no está disponible en el runner"
            exit 1
          fi
          # Reempaquetar con appimagetool (conserva el AppRun y los hooks).
          curl -sL -o "$WORK/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$WORK/appimagetool"
          (
            cd "$WORK/squashfs-root"
            "$WORK/appimagetool" --no-appstream . "$APPIMAGE_ABS.new"
          )
          mv "$APPIMAGE_ABS.new" "$APPIMAGE_ABS"
          rm -rf "$WORK"
          ls -la target/release/bundle/appimage/

      - name: Organizar artefactos de compilación Linux
        run: |
          mkdir -p dist/linux
          # Copiar paquetes DEB
          if ls target/release/bundle/deb/*.deb 1> /dev/null 2>&1; then
            cp target/release/bundle/deb/*.deb dist/linux/
            echo "Paquete DEB copiado con éxito."
          else
            echo "Aviso: No se encontraron paquetes DEB generados."
          fi

          # Copiar paquetes AppImage
          if ls target/release/bundle/appimage/*.AppImage 1> /dev/null 2>&1; then
            cp target/release/bundle/appimage/*.AppImage dist/linux/
            echo "Paquete AppImage copiado con éxito."
          else
            echo "Aviso: No se encontraron paquetes AppImage generados."
          fi

          # Copiar binario crudo y scripts con exclusión de secretos
          mkdir -p dist/linux/Syncify-Linux-Raw
          cp target/release/syncify-tauri dist/linux/Syncify-Linux-Raw/syncify
          chmod +x dist/linux/Syncify-Linux-Raw/syncify

          # Incluir los binarios externos junto al binario crudo (resolución en runtime)
          mkdir -p dist/linux/Syncify-Linux-Raw/bin
          cp src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu  dist/linux/Syncify-Linux-Raw/bin/ffmpeg
          cp src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu dist/linux/Syncify-Linux-Raw/bin/ffprobe
          cp src-tauri/binaries/fpcalc-x86_64-unknown-linux-gnu  dist/linux/Syncify-Linux-Raw/bin/fpcalc
          chmod +x dist/linux/Syncify-Linux-Raw/bin/ffmpeg dist/linux/Syncify-Linux-Raw/bin/ffprobe dist/linux/Syncify-Linux-Raw/bin/fpcalc

          # Copiar scripts excluyendo secretos y cachés temporales
          mkdir -p dist/linux/Syncify-Linux-Raw/scripts
          rsync -av --exclude='.*' --exclude='*.json' --exclude='*.cache' --exclude='__pycache__' \
            --exclude='*.log' --exclude='*.tmp' --exclude='*.db' --exclude='*.key' \
            --exclude='credentials*' --exclude='.env*' scripts/ dist/linux/Syncify-Linux-Raw/scripts/

          cd dist/linux && tar -czvf Syncify-Linux-x86_64.tar.gz Syncify-Linux-Raw/
          echo "Tarball crudo generado en dist/linux/Syncify-Linux-x86_64.tar.gz"

      - name: Subir Paquetes Linux como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Syncify-Linux-Packages
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
            dist/linux/Syncify-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Crear Release en GitHub (Opcional)
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          # Sin esto la accion crea el tag apuntando a la rama por defecto
          # (main), no al commit verificado por la puerta. Si main avanzaba
          # entre la verificacion y la publicacion, el tag acabaria en un
          # commit distinto del compilado y con CI desconocido.
          target_commitish: ${{ github.sha }}
          name: "Syncify ${{ inputs.release_tag }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/linux/*.deb
            dist/linux/*.AppImage
            dist/linux/Syncify-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
