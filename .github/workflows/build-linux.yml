name: Build Linux (AppImage & DEB)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '¿Publicar automáticamente como Release en GitHub?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag de la release (ej: v0.1.0)'
        required: false
        type: string
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # No se compila ni se publica nada hasta confirmar que este commit tiene
  # CI verde y que el tag no se esta moviendo.
  #
  # Es un paso `run:` normal, no un reusable workflow (`uses:`). Invocar un
  # reusable desde un workflow_dispatch no arranca: el run moria en
  # startup_failure antes del primer paso. Se comprobó que no era el
  # contenido de la puerta, sustituyéndola por un reusable minimo de un solo
  # `run: echo ok` y viendo que el fallo se repetia. Toda la logica vive en
  # scripts/ci/release_gate.py, que tambien se puede ejecutar en local con
  # `gh` autenticado para probar la puerta sin gastar ~90 minutos de runner.
  gate:
    name: Verificar CI verde y tag publicable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout del repositorio
        if: ${{ inputs.create_release }}
        uses: actions/checkout@v4

      # Las tres reglas de la puerta (formato vX.Y.Z -> CI verde para el SHA
      # exacto -> tag no movible) y sus diagnosticos viven en el script.
      - name: Puerta de publicación
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/release_gate.py --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"

  build-linux:
    needs: gate
    name: Compilar Syncify para Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (GTK, WebKit2GTK, dev tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg \
            libchromaprint-tools \
            python3-pip \
            python3-venv

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configurar toolchain Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de artefactos Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Binarios estáticos que viajan dentro del DEB/AppImage (bundle.externalBin):
      # el usuario no instala ni configura ffmpeg/fpcalc. La URL y el SHA-256 de
      # cada herramienta viven en la tabla única del proveedor
      # (scripts/dependency_manager.py): un repin es un commit allí, no aquí.
      # Descarga, verificación y colocación con triple es lo que hace el módulo.
      - name: Descargar y colocar binarios externos (ffmpeg, ffprobe, fpcalc)
        run: |
          set -euo pipefail
          python3 scripts/dependency_manager.py place-external --triple x86_64-unknown-linux-gnu
          ls -la src-tauri/binaries/

      # Mirror de Windows (runtime autónomo + requirements + smoke): un CPython
      # reubicable con las dependencias ya instaladas viaja dentro de cada
      # artefacto Linux, de modo que la app funcione tras instalar sin pedirle
      # Python ni pip al usuario. Descarga (python-build-standalone 20240415),
      # verificación SHA-256, requirements y smoke canónico de 10 imports viven
      # en la tabla de pines y el módulo del proveedor
      # (scripts/dependency_manager.py): un repin es un commit allí, no aquí.
      # Produce bundle/python, el árbol que consumen la inyección en el
      # AppImage/DEB, el tarball crudo y los smokes del final.
      - name: Preparar Python autónomo con dependencias
        run: |
          set -euo pipefail
          python3 scripts/dependency_manager.py install-runtime
          du -sh bundle/python

      - name: Instalar dependencias de UI
        working-directory: ui
        run: npm ci

      - name: Compilar Frontend (Vue 3 / Vite)
        working-directory: ui
        run: npm run build

      - name: Compilar con Tauri v2 (DEB y AppImage)
        run: npx --prefix ui tauri build

      # WebKitGTK delega la reproducción HTML5 a GStreamer. El AppImage
      # empaqueta las librerías (linuxdeploy las arrastra por dependencia de
      # webkit2gtk) pero NINGÚN plugin: sin /usr/lib/gstreamer-1.0 no existe
      # autoaudiosink y la reproducción falla con
      # "GStreamer element autoaudiosink not found. Please install it".
      # Se añaden los plugins mínimos de audio y vídeo al AppImage.
      # autoaudiosink/autovideosink viven en gst-plugins-good, que NO viene
      # instalado en los runners: sin él el paso siguiente no encuentra nada
      # que copiar (primera iteración empaquetó 13 plugins y ninguno de sink).
      - name: Instalar plugins de GStreamer y verificar los sinks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio

          # Sin esto el runner no trae autoaudiosink/autovideosink y el AppImage
          # se publica sin salida de audio. Sin `|| true`: si la instalacion
          # falla hay que verlo, no seguir en silencio.
          #
          # La comprobacion la hace GStreamer, no una lista de nombres de
          # fichero. Una version anterior buscaba un .so por sinks, nombre que
          # no existe: autoaudiosink y autovideosink son dos elementos dentro de
          # una misma libreria, asi que el paso fallaba con los plugins ya
          # instalados y decia que faltaban cuando no faltaban.
          for el in autoaudiosink autovideosink; do
            if ! gst-inspect-1.0 "$el" >/dev/null 2>&1; then
              echo "::error::el elemento '$el' no esta registrado en el runner"
              echo "--- elementos autosink registrados ---"
              gst-inspect-1.0 | grep -i autosink || true
              exit 1
            fi
          done
          echo "OK: autoaudiosink y autovideosink registrados"

      - name: Inyectar plugins de GStreamer en el AppImage
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          WORK="$(mktemp -d)"
          APPIMAGE_ABS="$PWD/$APPIMAGE"
          (
            cd "$WORK"
            "$APPIMAGE_ABS" --appimage-extract >/dev/null
          )
          PLUGDIR="$WORK/squashfs-root/usr/lib/gstreamer-1.0"
          mkdir -p "$PLUGDIR"

          # Cada libreria se copia segun la ruta que dice gst-inspect, no
          # segun un nombre supuesto. Este paso fallo tres veces seguidas por
          # hardcodear nombres de fichero que no existen:
          # libgstautoaudiosink.so, libgstautovideosink.so y
          # libgstautosink.so. autoaudiosink y autovideosink son ELEMENTOS, y
          # gst-inspect dice que libreria aporta cada uno.
          gst-inspect-1.0 > "$WORK/gst-elements.txt"
          : > "$WORK/libs.txt"

          # Elementos imprescindibles para reproducir audio y video. Esta
          # lista si es una decision de producto: es lo que la app necesita.
          #
          # gst-inspect lista como "plugin:  elemento: descripcion", asi que el
          # elemento NO va al principio de la linea. Con "^$el:" no coincidia
          # nunca y el paso rechazaba un AppImage con los sinks correctos.
          REQUIRED="autoaudiosink autovideosink playbin decodebin audioconvert
                     audioresample videoconvert typefindfunctions"
          for el in $REQUIRED; do
            if ! grep -qE "(^|[[:space:]])$el:" "$WORK/gst-elements.txt"; then
              echo "::error::elemento obligatorio ausente del registro: $el"
              exit 1
            fi
            # La ruta real de la libreria que aporta ese elemento.
            # gst-inspect separa "Filename" del valor con espacios y SIN dos
            # puntos, asi que un sed que busque "Filename:" no extrae nada.
            # Lo que funciona es tomar, en esa linea, el primer token que
            # empieza por "/".
            lib=$(gst-inspect-1.0 "$el" 2>/dev/null | awk '/^[[:space:]]*Filename/ {for(i=1;i<=NF;i++) if($i ~ /^\//) {print $i; exit}}')
            if [ -z "$lib" ] || [ ! -f "$lib" ]; then
              echo "::error::gst-inspect no dio una ruta existente para $el"
              exit 1
            fi
            echo "$lib" >> "$WORK/libs.txt"
          done

          # Los sinks entre los que el automatico elige en runtime segun la
          # maquina del usuario: ALSA, PulseAudio, PipeWire y JACK.
          for lib in $(find /usr/lib /lib -name 'libgstalsa.so' \
                          -o -name 'libgstpulseaudio.so' \
                          -o -name 'libgstpipewire.so' \
                          -o -name 'libgstjack.so' 2>/dev/null | sort -u); do
            echo "$lib" >> "$WORK/libs.txt"
          done

          sort -u "$WORK/libs.txt" | while read -r lib; do
            cp -a "$lib" "$PLUGDIR/"
          done

          echo "Plugins de GStreamer copiados: $(ls -1 "$PLUGDIR" | wc -l)"
          ls -1 "$PLUGDIR"

          # Sin sink de audio el AppImage arranca pero no suena. Publicar un
          # paquete roto es peor que fallar la build. Se comprueba por
          # capacidad: PREGUNTANDO cual es la libreria de cada sink, no
          # comparando con un nombre supuesto.
          for el in autoaudiosink autovideosink; do
            lib=$(gst-inspect-1.0 "$el" 2>/dev/null | awk '/^[[:space:]]*Filename/ {for(i=1;i<=NF;i++) if($i ~ /^\//) {print $i; exit}}')
            if [ ! -f "$PLUGDIR/$(basename "$lib")" ]; then
              echo "::error::la libreria de $el no llego al AppImage"
              exit 1
            fi
          done

          # Las libwayland-* que linuxdeploy arrastra por dependencia de
          # webkit2gtk (copias de Ubuntu 22.04, wayland 1.20) envenenan el EGL
          # del anfitrion: dentro del proceso ensombrecen a las del sistema via
          # LD_LIBRARY_PATH y la Mesa reciente necesita simbolos que 1.20 no
          # exporta (p.ej. wl_fixes_interface, wayland >= 1.22). El dlopen del
          # vendor EGL (libEGL_mesa) falla, glvnd responde EGL_BAD_PARAMETER y
          # el WebKitWebProcess muere con "Could not create default EGL
          # display: EGL_BAD_PARAMETER. Aborting...", dejando la ventana en
          # blanco. Reproducido en CachyOS (Mesa 26.2.4): con las copias
          # empaquetadas aborta siempre (WEBKIT_DISABLE_COMPOSITING_MODE ni
          # LIBGL_ALWAYS_SOFTWARE lo evitan); sin ellas el WebProcess vive.
          # Cualquier anfitrion capaz de correr GTK3 tiene libwayland en el
          # sistema y es retrocompatible con el binario de webkit. El smoke de
          # arranque del final no puede ver esto: la Mesa del runner si es
          # compatible con las copias 1.20.
          rm -f "$WORK/squashfs-root"/usr/lib/libwayland-*.so*

          # #212: linuxdeploy arrastra su propio usr/bin/xdg-open (xdg-utils
          # 1.1.3, base Ubuntu 22.04) y el AppRun antepone el bin/ del AppDir
          # al PATH, de modo que ese xdg-open viejo ensombrece al del
          # anfitrion para cualquier hijo de la app. En Plasma 6
          # (KDE_SESSION_VERSION=6) el open_kde() de 1.1.x no tiene rama y
          # sale 0 sin abrir nada: el login Tidal cree que abrio la pestana y
          # sondea 300 s, reveal/open y los enlaces externos se rompen igual.
          # Sin copia empaquetada, el PATH resuelve el xdg-open (y gio,
          # kde-open) del sistema, que si conoce el escritorio del usuario.
          # Misma medicina que las libwayland de arriba: la copia vieja del
          # paquete no mejora al anfitrion, lo envenena.
          rm -f "$WORK/squashfs-root/usr/bin/xdg-open"

          # En la linea de la asercion de sinks de arriba: si el fichero
          # sigue en el AppDir que se va a empaquetar, el AppImage saldria
          # con el bug de #212 dentro y nadie lo veria. La build falla, no
          # se publica.
          if [ -f "$WORK/squashfs-root/usr/bin/xdg-open" ]; then
            echo "::error::el xdg-open empaquetado sigue en el AppDir; ensombreceria al del anfitrion (#212)"
            exit 1
          fi

          # appimagetool (continuous) rechaza directorios con modo 0700; los
          # recursos que Tauri empaqueta conservan permisos restrictivos.
          chmod -R a+rX "$WORK/squashfs-root"

          # Reempaquetar con appimagetool (conserva el AppRun y los hooks).
          curl -sL -o "$WORK/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$WORK/appimagetool"
          (
            cd "$WORK/squashfs-root"
            "$WORK/appimagetool" --no-appstream . "$APPIMAGE_ABS.new"
          )
          mv "$APPIMAGE_ABS.new" "$APPIMAGE_ABS"
          rm -rf "$WORK"
          ls -la target/release/bundle/appimage/

      - name: Inyectar Python y scripts en el AppImage
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          WORK="$(mktemp -d)"
          APPIMAGE_ABS="$PWD/$APPIMAGE"
          (
            cd "$WORK"
            "$APPIMAGE_ABS" --appimage-extract >/dev/null
          )
          ROOT="$WORK/squashfs-root"

          # get_project_root sube desde usr/bin y encuentra <AppDir>/resources/
          # (scripts + python); get_python_executable devuelve entonces
          # resources/python/bin/python. Espejo del python-embed de Windows.
          mkdir -p "$ROOT/resources/scripts"
          cp -a bundle/python "$ROOT/resources/python"
          cp scripts/*_bridge.py scripts/dependency_manager.py scripts/requirements.txt \
            "$ROOT/resources/scripts/"
          cp -a scripts/services "$ROOT/resources/scripts/services"
          rm -rf "$ROOT/resources/scripts/services/__pycache__"

          # Reempaquetar conservando AppRun y hooks (misma técnica del paso
          # de GStreamer).
          chmod -R a+rX "$ROOT"
          curl -sL -o "$WORK/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$WORK/appimagetool"
          (
            cd "$ROOT"
            "$WORK/appimagetool" --no-appstream . "$APPIMAGE_ABS.new"
          )
          mv "$APPIMAGE_ABS.new" "$APPIMAGE_ABS"
          rm -rf "$WORK"
          ls -la target/release/bundle/appimage/

      - name: Organizar artefactos de compilación Linux
        run: |
          mkdir -p dist/linux
          # Copiar paquetes DEB
          if ls target/release/bundle/deb/*.deb 1> /dev/null 2>&1; then
            cp target/release/bundle/deb/*.deb dist/linux/
            echo "Paquete DEB copiado con éxito."
          else
            echo "Aviso: No se encontraron paquetes DEB generados."
          fi

          # Copiar paquetes AppImage
          if ls target/release/bundle/appimage/*.AppImage 1> /dev/null 2>&1; then
            cp target/release/bundle/appimage/*.AppImage dist/linux/
            echo "Paquete AppImage copiado con éxito."
          else
            echo "Aviso: No se encontraron paquetes AppImage generados."
          fi

          # Copiar binario crudo y scripts con exclusión de secretos
          mkdir -p dist/linux/Syncify-Linux-Raw
          cp target/release/syncify-tauri dist/linux/Syncify-Linux-Raw/syncify
          chmod +x dist/linux/Syncify-Linux-Raw/syncify

          # Incluir los binarios externos junto al binario crudo (resolución en runtime)
          mkdir -p dist/linux/Syncify-Linux-Raw/bin
          cp src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu  dist/linux/Syncify-Linux-Raw/bin/ffmpeg
          cp src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu dist/linux/Syncify-Linux-Raw/bin/ffprobe
          cp src-tauri/binaries/fpcalc-x86_64-unknown-linux-gnu  dist/linux/Syncify-Linux-Raw/bin/fpcalc
          chmod +x dist/linux/Syncify-Linux-Raw/bin/ffmpeg dist/linux/Syncify-Linux-Raw/bin/ffprobe dist/linux/Syncify-Linux-Raw/bin/fpcalc

          # Copiar scripts excluyendo secretos y cachés temporales
          mkdir -p dist/linux/Syncify-Linux-Raw/scripts
          rsync -av --exclude='.*' --exclude='*.json' --exclude='*.cache' --exclude='__pycache__' \
            --exclude='*.log' --exclude='*.tmp' --exclude='*.db' --exclude='*.key' \
            --exclude='credentials*' --exclude='.env*' scripts/ dist/linux/Syncify-Linux-Raw/scripts/

          # Python autónomo junto a scripts/: get_project_root encuentra
          # Syncify-Linux-Raw (tiene scripts/) y get_python_executable
          # devuelve <raíz>/python/bin/python.
          cp -a bundle/python dist/linux/Syncify-Linux-Raw/python

          # Inyectar el mismo Python en el DEB: los recursos de Tauri viven
          # en usr/lib/<producto>/_up_/scripts, y el resolutor acepta un
          # python/ hermano de ese scripts/.
          if ls dist/linux/*.deb 1> /dev/null 2>&1; then
            DEB=$(ls dist/linux/*.deb | head -1)
            DEBWORK="$(mktemp -d)"
            dpkg-deb -R "$DEB" "$DEBWORK/pkg"
            UP_SCRIPTS="$(dirname "$(find "$DEBWORK/pkg" -path '*_up_/scripts/dependency_manager.py' | head -1)")"
            if [ -z "$UP_SCRIPTS" ] || [ "$UP_SCRIPTS" = "/" ]; then
              echo "::error::el DEB no contiene _up_/scripts; no se puede inyectar Python"
              exit 1
            fi
            cp -a bundle/python "$UP_SCRIPTS/../python"
            # Regenerar md5sums: dpkg no lo hace al reempaquetar.
            (
              cd "$DEBWORK/pkg"
              find . -type f ! -path './DEBIAN/*' -printf '%P\0' | sort -z \
                | xargs -0 -I{} md5sum "{}" > DEBIAN/md5sums
            )
            dpkg-deb --root-owner-group -b "$DEBWORK/pkg" "$DEB"
            rm -rf "$DEBWORK"
            echo "Python inyectado en $DEB"
          fi

          # ── Smoke test del Python empaquetado en cada artefacto final ──
          # Un paquete cuyo Python no importe los módulos críticos se
          # publica roto; esto lo detecta antes de subir nada. La lista
          # canónica de imports y la limpieza de PYTHONHOME/PYTHONPATH viven
          # en el módulo (smoke-imports); aquí solo se elige qué intérprete
          # se verifica en cada artefacto.
          echo "== Smoke python: tarball crudo =="
          python3 scripts/dependency_manager.py smoke-imports \
            --python dist/linux/Syncify-Linux-Raw/python/bin/python3
          echo "OK tarball"

          echo "== Smoke python: AppImage (con el entorno que deja AppRun) =="
          AI=$(ls dist/linux/*.AppImage | head -1)
          AI_ABS="$PWD/$AI"
          AIWORK="$(mktemp -d)"
          ( cd "$AIWORK" && "$AI_ABS" --appimage-extract >/dev/null )
          LD_LIBRARY_PATH="$AIWORK/squashfs-root/usr/lib" \
            python3 scripts/dependency_manager.py smoke-imports \
            --python "$AIWORK/squashfs-root/resources/python/bin/python"
          echo "OK appimage"
          rm -rf "$AIWORK"

          if ls dist/linux/*.deb 1> /dev/null 2>&1; then
            echo "== Smoke python: DEB =="
            DEB=$(ls dist/linux/*.deb | head -1)
            DEBWORK="$(mktemp -d)"
            dpkg-deb -x "$DEB" "$DEBWORK/root"
            PYDEB="$(find "$DEBWORK/root" -path '*_up_/python/bin/python' | head -1)"
            if [ -z "$PYDEB" ]; then
              echo "::error::el DEB final no contiene _up_/python/bin/python"
              exit 1
            fi
            python3 scripts/dependency_manager.py smoke-imports --python "$PYDEB"
            echo "OK deb"
            rm -rf "$DEBWORK"
          fi

          cd dist/linux && tar -czf Syncify-Linux-x86_64.tar.gz Syncify-Linux-Raw/
          echo "Tarball crudo generado en dist/linux/Syncify-Linux-x86_64.tar.gz"
          du -sh Syncify-Linux-Raw Syncify-Linux-x86_64.tar.gz *.AppImage 2>/dev/null || true

      # El abort de EGL ("Could not create default EGL display: EGL_BAD_PARAMETER.
      # Aborting...") mata el proceso entero y ningun paso anterior lo ve: el
      # smoke de Python solo lanza el interprete. Aqui arranca la app de verdad
      # y se comprueba que sigue viva y que su log cuenta lo mismo. El runner no
      # tiene GPU, asi que esto NO reproduce la combinacion (Iris Xe + Wayland)
      # que provoca el fallo del usuario: cubre el arranque, no ese hardware.
      #
      # Se lanza via el AppRun EXTRAIDO y no el binario pelado: los runners no
      # garantizan FUSE, y ejecutar usr/bin/syncify-tauri a pelo deja el proceso
      # sin el LD_LIBRARY_PATH y los hooks GTK que AppRun exporta; con eso
      # WebKit resuelve sus procesos auxiliares en una ruta relativa al cwd
      # ("././/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess") y
      # muere con un abort que no es culpa del paquete. Reproducido con el
      # AppImage de v0.3.0: directo falla (exit 133), via AppRun vive.
      - name: Arranque real del AppImage (guarda contra el abort de EGL)
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          AI=$(ls dist/linux/*.AppImage | head -1)
          AI_ABS="$PWD/$AI"
          WORK="$(mktemp -d)"
          ( cd "$WORK" && "$AI_ABS" --appimage-extract >/dev/null )
          APPRUN="$WORK/squashfs-root/AppRun"
          if [ ! -x "$APPRUN" ]; then
            echo "::error::no se encontro AppRun dentro del AppImage"
            ls -R "$WORK/squashfs-root/usr" | head -40
            exit 1
          fi
          LOG="$(mktemp)"
          set +e
          # 124 es el codigo de `timeout` cuando el proceso aguanto hasta el corte.
          timeout --signal=INT 45 xvfb-run -a "$APPRUN" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          if grep -q "Could not create default EGL display" "$LOG"; then
            echo "::error::el AppImage aborta al crear el display EGL"
            exit 1
          fi
          if grep -q "Unable to spawn a new child process" "$LOG"; then
            echo "::error::el AppImage no logra lanzar los procesos auxiliares de WebKit"
            exit 1
          fi
          if ! grep -q "Syncify starting" "$LOG"; then
            echo "::error::la app no llego al arranque (log arriba)"
            exit 1
          fi
          if [ "$code" -ne 124 ]; then
            echo "::error::la app salio con codigo $code en vez de seguir viva (log arriba)"
            exit 1
          fi
          echo "Arranque verificado: ventana viva 45 s sin abort de EGL"

      - name: Subir Paquetes Linux como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Syncify-Linux-Packages
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
            dist/linux/Syncify-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Crear Release en GitHub (Opcional)
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          # Sin esto la accion crea el tag apuntando a la rama por defecto
          # (main), no al commit verificado por la puerta. Si main avanzaba
          # entre la verificacion y la publicacion, el tag acabaria en un
          # commit distinto del compilado y con CI desconocido.
          target_commitish: ${{ github.sha }}
          name: "Syncify ${{ inputs.release_tag }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/linux/*.deb
            dist/linux/*.AppImage
            dist/linux/Syncify-Linux-x86_64.tar.gz
