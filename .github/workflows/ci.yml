name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed:
    name: Detectar areas afectadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deteccion y fallback viven en scripts/ci/resolve_areas.py (con su test):
    # dorny emite los strings "true"/"false" y en las expresiones de GitHub
    # cualquier string no vacio (incluido "false") es truthy, la trampa que
    # costo 5 commits de reparacion. Aqui solo viaja UN output, una lista
    # JSON que los tres jobs consultan por pertenencia exacta.
    # El workflow que ejecuta la familia es parte de cada area: tocar ci.yml
    # re-ejecuta la familia en las dos patas del matrix, la misma filosofia
    # fail-safe del fallback (correr todo antes que no correr nada). El script
    # de dependencias nativas tambien es input del job Rust.
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      # Patas del job Rust: Windows solo en los eventos donde su contexto es
      # requerido por la proteccion de main (#368). test: test_rust_matrix.py.
      rust_os: ${{ steps.rust_matrix.outputs.rust_os }}
    steps:
    - uses: actions/checkout@v4
    - id: filter
      uses: dorny/paths-filter@v3
      with:
        base: ${{ github.event.pull_request.base.sha || github.event.before }}
        ref: ${{ github.sha }}
        filters: "rust:\n  - 'src-tauri/**'\n  - 'crates/**'\n  - 'scripts/install_native_deps.sh'\n  - '.github/workflows/ci.yml'\nfrontend:\n  - 'ui/**'\n  - '.github/workflows/ci.yml'\npython:\n  - 'scripts/**'\n  - 'tools/**'\n  - '.github/workflows/ci.yml'\ndocs:\n  - 'docs/**'\n  - '**.md'\n  - 'AGENTS.md'\n  - 'GLOSSARY.md'\n  - '.github/workflows/ci.yml'\n  - '.github/workflows/docs-check.yml'\n"
    - id: areas
      name: Resolver areas afectadas (fallback incluido)
      env:
        FILTER_RUST: ${{ steps.filter.outputs.rust }}
        FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        FILTER_PYTHON: ${{ steps.filter.outputs.python }}
        FILTER_DOCS: ${{ steps.filter.outputs.docs }}
      run: python3 scripts/ci/resolve_areas.py
    - id: rust_matrix
      name: Resolver patas del job Rust (Windows solo en main)
      # La regla y su test viven en scripts/ci/rust_matrix.py: una expresion
      # inline del workflow no se puede probar y una errata dejaria main sin
      # los 6 contextos requeridos.
      run: python3 scripts/ci/rust_matrix.py
  rust:
    name: Rust (src-tauri · check · test · clippy · fmt)
    needs: changed
    # La familia de verificacion corre en las dos patas (#268): la de Linux es
    # la hermana historica; la de Windows consume solo lo versionado (WebView2
    # en vez de webkit2gtk, herramientas de test desde el proveedor pineado).
    # Desde #368 Windows solo se ejecuta donde su contexto es un check
    # requerido: push a main y PR consolidado a main. En PRs de carril a
    # `wave/*` basta Ubuntu (la decision esta en scripts/ci/rust_matrix.py y
    # sus tests). Los nombres de contexto no cambian: el sufijo `(os)` sigue
    # saliendo del matrix y la proteccion de main sigue exigiendo las dos.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changed.outputs.rust_os) }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'rust')"
      run: 'echo "Sin cambios en src-tauri/ ni crates/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
      uses: actions/checkout@v4
    # El incidente del 2026-11-07 (corrida 42216381025) murio a los 60
    # minutos descargando .deb de un mirror lento. Dos defensas baratas:
    # 1) Acquire::Retries: viaja en cada invocacion de apt-get del script
    #    (scripts/install_native_deps.sh), asi que no depende de un
    #    apt.conf.d que solo prepara este workflow.
    # 2) cache de /var/cache/apt/archives: los .deb ya descargados se
    #    reutilizan en la siguiente corrida y apt los verifica contra el
    #    indice (uno alterado o desfasado se vuelve a descargar). La clave
    #    es el hash del script, dueno unico de la lista: editar la lista
    #    invalida la cache; editar el resto del workflow no.
    - name: Cache de paquetes apt descargados
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-v1-${{ runner.os }}-${{ hashFiles('scripts/install_native_deps.sh') }}
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Linux'
    - name: Instalar dependencias nativas de Tauri (GTK y WebKit2GTK)
      working-directory: ${{ github.workspace }}
      run: bash scripts/install_native_deps.sh
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Linux'
    # En Windows Tauri usa WebView2 (no webkit2gtk): check/clippy/test no
    # necesitan dependencias GTK. Las herramientas de test (ffmpeg/ffprobe/
    # fpcalc/flac) no vienen de un gestor de paquetes sino del proveedor
    # pineado del arbol (scripts/dependency_manager.py, SHA-256 verificado),
    # la misma tabla que consumen los builds de release.
    - name: Configurar Python 3.11 (host CI para el proveedor de pines)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Descargar y colocar herramientas pineadas (ffmpeg, ffprobe, fpcalc, flac)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python scripts/dependency_manager.py place-external --triple x86_64-pc-windows-msvc
        python scripts/dependency_manager.py install flac
    # El overlay de empaquetado de Windows (tauri.windows.conf.json) declara
    # el runtime Python embebido como recurso (../python/**/*); el build.rs de
    # tauri aborta si el glob no matchea nada. La familia de verificacion no
    # ejecuta la app: basta un marcador explicito, y asi el arbol sigue sin
    # runtime empaquetado (la higiene de cmd_utils_test lo vigila y los
    # builds de release montan el runtime real con install-runtime).
    - name: Marcador del recurso python/ que exige el overlay de Windows
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        mkdir -p python
        printf 'Marcador de CI: tauri-build exige que el glob ../python/**/* matchee. El runtime real lo monta dependency_manager.py install-runtime en los builds de release (build-windows.yml).\n' > python/CI-RESOURCE-PLACEHOLDER.txt
        ls -la python/
    - name: Herramientas pineadas en PATH
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        for tool in ffmpeg ffprobe fpcalc flac; do
          dir="$(python -c "import sys; sys.path.insert(0, 'scripts'); import dependency_manager; p = dependency_manager.get_tool_path('$tool'); print(p.parent if p else '')")"
          if [ -z "$dir" ]; then
            echo "::error::Herramienta $tool no encontrada en bin/ tras el proveedor"
            exit 1
          fi
          echo "$dir" >> "$GITHUB_PATH"
          echo "$tool -> $dir"
        done
    - name: Comprobar ejecutable FLAC requerido por tests
      run: flac --version
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Comprobar capacidad FFmpeg para WebP animado
      shell: bash
      run: "ffmpeg -version\nffmpeg -hide_banner -decoders | grep -E 'webp(_anim)?' || true\nif ffmpeg -hide_banner -loglevel error \\\n  -i tests/fixtures/animated-cover.webp -f null -; then\n  echo \"\
        SYNCIFY_ANIMATED_WEBP_E2E=1\" >> \"$GITHUB_ENV\"\n  echo \"FFmpeg decodifica el fixture WebP animado; se ejecutará el E2E real.\"\nelse\n  echo \"SYNCIFY_ANIMATED_WEBP_E2E=0\" >> \"$GITHUB_ENV\"\
        \n  echo \"::warning::FFmpeg del runner no decodifica WebP animado; el E2E real se omite explícitamente.\"\nfi\n"
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Instalar toolchain Rust fijado 1.98.1 (con clippy y rustfmt)
      uses: dtolnay/rust-toolchain@1.98.1
      with:
        components: clippy, rustfmt
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Cache de artefactos cargo (workspace virtual de la raiz)
      uses: Swatinem/rust-cache@v2
      with:
        # El workspace es virtual en la raiz del repo (`[workspace]` en
        # Cargo.toml); `src-tauri` es un miembro, no la raiz. Con
        # `workspaces: src-tauri` la accion cacheaba `src-tauri/target`, que no
        # existe: la entrada pesaba 149 MB (solo `~/.cargo/registry`, medido en
        # la corrida 44947072166) y cada corrida compilaba las dependencias en
        # frio. `. -> target` es el default documentado de la accion; se deja
        # explicito para que nadie lo vuelva a estrechar a un miembro.
        workspaces: ". -> target"
        # Con target/ dentro, cada rama guardaria una entrada de GB; el tope
        # del repositorio son 10 GB y las entradas de main expulsarian a las
        # demas. Los PRs restauran de su rama base y de la rama por defecto
        # (asi llega la cache de main): que solo main la escriba.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        # Aislamiento explicito de las dos patas del matrix: target/debug
        # contiene artefactos MSVC en Windows y ELF en Linux; que no se
        # crucen aunque la accion ya separe por OS.
        key: ${{ runner.os }}
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Construir frontend requerido por Tauri
      working-directory: ui
      run: npm ci && npm run build
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    # --workspace: el job corre desde `src-tauri`, que es un miembro del
    # workspace virtual de la raiz; sin la bandera solo se compilaba ese
    # paquete y los crates/ solo entraban como dependencias. Con ella se
    # compilan y se ejecutan sus targets propios (lib y tests) sin cambiar
    # el directorio de trabajo ni el target cacheado (`./target`).
    - name: cargo check --workspace --all-targets --locked
      run: cargo check --workspace --all-targets --locked
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    # Los exe de test no llevan el manifiesto que tauri-build embebe en el
    # binario de la app: el loader de Windows resuelve comctl32 v5 y mueren al
    # cargar (STATUS_ENTRYPOINT_NOT_FOUND) por imports que solo existen en v6
    # (SetWindowSubclass y compania, via tao/wry). Mismo problema y misma cura
    # que la guardia del keyring en build-windows.yml: compilar sin ejecutar,
    # embeber el manifiesto v6 con mt.exe en cada exe de deps/ y correr.
    - name: Compilar binarios de test sin ejecutar (base del manifiesto comctl32)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      run: cargo test --workspace --locked --no-run
    - name: Embeber manifiesto comctl32 v6 en los exe de test
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $mt) { throw "mt.exe no encontrado en Windows Kits" }
        Write-Host "mt: $($mt.FullName)"
        $manifest = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/comctl32.manifest"
        if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
          throw "Falta el manifiesto comctl32: $manifest"
        }
        # El target/ del workspace vive en la raiz del repo, no en src-tauri/.
        $deps = Join-Path $env:GITHUB_WORKSPACE "target\debug\deps"
        $patched = 0
        Get-ChildItem -Path $deps -Filter "*.exe" | ForEach-Object {
          & $mt.FullName -manifest $manifest -outputresource:"$($_.FullName);#1" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mt.exe fallo con $($_.Name)" }
          $patched++
        }
        Write-Host "Manifiesto embebido en $patched exe de test"
    - name: Suite de tests completa
      # --workspace (el comando canonico del AGENTS.md): desde `src-tauri` el
      # `cargo test` sin bandera solo ejecutaba ese paquete; los tests de los
      # crates/ del workspace nunca llegaban a CI. --no-fail-fast: un binario
      # de test que falle no tapa el resultado de los demas, la evidencia es
      # completa por corrida en las dos patas del matrix.
      run: cargo test --workspace --locked --no-fail-fast
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: batch_50_audit_test serializado (--test-threads=1)
      timeout-minutes: 10
      shell: bash
      # Puerta anti-regresion de #364: la suite completa acaba de compilar el
      # crate, asi que este paso no debe recompilarlo. Antes lo hacia (1m50s en
      # ubuntu, 2m53s en windows para 3 s de test) porque un fichero nacido
      # durante la suite bajo `../scripts` —un `__pycache__` de los bridges—
      # invalidaba el fingerprint que vigila el build script de tauri. El
      # interruptor vive en `.cargo/config.toml`; si esto vuelve a dispararse,
      # el detalle por fichero lo da
      # `CARGO_LOG=cargo::core::compiler::fingerprint=info`.
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/batch_50.log"
        cargo test --locked --test batch_50_audit_test -- --test-threads=1 2>&1 | tee "$log"
        if grep -q "Compiling syncify-tauri" "$log"; then
          echo "::error::El paso serializado recompilo syncify-tauri: algo que el build script vigila cambio durante la suite."
          exit 1
        fi
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: cargo clippy estricto
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: cargo fmt --all -- --check
      run: cargo fmt --all -- --check
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
  frontend:
    needs: changed
    name: Frontend (ui · vue-tsc · vitest)
    # Mismo matrix que la familia rust (#268): la UI y su suite son
    # cross-platform (Node/Vitest/Vue-tsc), no hay pasos por OS.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'frontend')"
      run: 'echo "Sin cambios en ui/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
      uses: actions/checkout@v4
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Instalar dependencias (npm ci, reproducible desde package-lock.json)
      run: npm ci
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Chequeo de tipos Vue/TS (vue-tsc --noEmit)
      run: npx vue-tsc --noEmit
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Tests unitarios (vitest run, modo CI)
      run: npm run test:run
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
  python:
    needs: changed
    name: Python (bridges · tests unitarios)
    # Mismo matrix que la familia rust (#268): la suite ya declara sus casos
    # POSIX con skipIf(IS_WINDOWS) y las dependencias tienen ruedas Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'python')"
      run: 'echo "Sin cambios en scripts/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      uses: actions/checkout@v4
      with:
        # #368: la suite Python incluye `test_agents_claims`; se mide el árbol
        # del head del PR, no el merge, para que un test Python añadido en otro
        # carril no invalide el recuento. El consolidado a main sigue siendo la
        # red final con la matriz completa.
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Configurar Python
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      uses: actions/setup-python@v5
      with:
        # La misma 3.11.x que empaquetan los builds de release: lo que CI
        # testea debe ser el runtime que se publica. Flotante dentro de 3.11:
        # el manifest de setup-python no trae el parche exacto 3.11.9 para el
        # runner nuevo (Ubuntu 26.04); la verificación exacta del runtime
        # publicado llega con #242 y sus smokes sobre el Python empaquetado.
        python-version: '3.11'
    - name: Instalar dependencias de bridges
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
    - name: Suite unittest de scripts/
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
  docs:
    needs: changed
    name: Docs (consistencia · claims · README)
    # Las tres puertas de docs viven en scripts/tests/ y no necesitan la suite
    # Python entera. El area `docs` existe para que un PR que solo toca
    # docs/**.md, AGENTS.md o GLOSSARY.md no pague las dos patas de Rust y la
    # de frontend; el toolchain Rust solo hace falta para `cargo metadata`
    # con el que test_agents_claims mide los objetivos de test. Las
    # dependencias de scripts/ sí hacen falta: la discovery cuenta imports y
    # sin ellas pierde casos, así que la cifra del AGENTS.md fallaría por el
    # entorno, no por el árbol.
    #
    # Desde #368 este job mide el ÁRBOL DEL HEAD DEL PR, no el merge que
    # GitHub construye con la base. Las cifras del AGENTS.md son un punto
    # caliente compartido: si dos carriles anaden un objetivo de test cada uno,
    # el merge tiene +2 y el segundo PR fallaba en docs aunque su rama fuera
    # correcta. La integración se detecta una sola vez en el consolidado a
    # main, que es la red final (con strict=true el head ya está al día con
    # main). En push se sigue midiendo el commit empujado.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Area sin cambios
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'docs')"
      run: 'echo "Sin cambios en docs/ ni en los ficheros de claims: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      uses: actions/checkout@v4
      with:
        # El HEAD del PR, no el merge con la base (#368). En push,
        # `github.event.pull_request` no existe y se mide el commit empujado.
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Configurar Python 3.11
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependencias de scripts/ (la discovery cuenta imports)
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
    - name: Instalar toolchain Rust fijado 1.98.1 (cargo metadata)
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      uses: dtolnay/rust-toolchain@1.98.1
    - name: Consistencia de docs y referencias
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      run: python -m unittest discover -s scripts/tests -p 'test_docs_consistency.py' -v
    - name: Cifras de los README
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      run: python -m unittest discover -s scripts/tests -p 'test_readme_claims.py' -v
    - name: Cifras del AGENTS.md
      if: contains(fromJSON(needs.changed.outputs.areas), 'docs')
      run: python -m unittest discover -s scripts/tests -p 'test_agents_claims.py' -v
