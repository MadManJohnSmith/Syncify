name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed:
    name: Detectar areas afectadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust || steps.fallback.outputs.RUST }}
      frontend: ${{ steps.filter.outputs.frontend || steps.fallback.outputs.FRONTEND }}
      python: ${{ steps.filter.outputs.python || steps.fallback.outputs.PYTHON }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # En una rama nueva, o tras reescribir la historia, paths-filter no
          # tiene base con la que comparar: se queda sin salida. El paso de
          # abajo lo cubre, porque un pipeline que no comprueba nada y sale
          # en verde es peor que uno lento.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            rust:
              - 'src-tauri/**'
              - 'crates/**'
            frontend:
              - 'ui/**'
            python:
              - 'scripts/**'
      # Si el filtro no produjo ninguna salida, se ejecutan todas las areas:
      # probar de mas, nunca de menos.
      - id: fallback
        name: Sin areas detectadas, probarlas todas
        if: >-
          ${{ steps.filter.outputs.rust != 'true' &&
               steps.filter.outputs.frontend != 'true' &&
               steps.filter.outputs.python != 'true' }}
        run: |
          echo "::notice::El filtro de rutas no detecto areas; se ejecutan todas."
          echo "RUST=true" >> "$GITHUB_OUTPUT"
          echo "FRONTEND=true" >> "$GITHUB_OUTPUT"
          echo "PYTHON=true" >> "$GITHUB_OUTPUT"
  rust:
    name: Rust (src-tauri · check · test · clippy · fmt)
    needs: changed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: needs.changed.outputs.rust != 'true'
      run: 'echo "Sin cambios en src-tauri/ ni crates/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: needs.changed.outputs.rust == 'true'
      uses: actions/checkout@v4
    - name: Instalar dependencias nativas de Tauri (GTK y WebKit2GTK)
      run: "sudo apt-get update\nsudo apt-get install -y \\\n  ffmpeg \\\n  flac \\\n  libwebkit2gtk-4.1-dev\
        \ \\\n  libgtk-3-dev \\\n  libayatana-appindicator3-dev \\\n  librsvg2-dev\n"
    - name: Comprobar ejecutable FLAC requerido por tests
      run: flac --version
    - name: Comprobar capacidad FFmpeg para WebP animado
      shell: bash
      run: "ffmpeg -version\nffmpeg -hide_banner -decoders | grep -E 'webp(_anim)?' || true\nif ffmpeg\
        \ -hide_banner -loglevel error \\\n  -i tests/fixtures/animated-cover.webp -f null -; then\n \
        \ echo \"SYNCIFY_ANIMATED_WEBP_E2E=1\" >> \"$GITHUB_ENV\"\n  echo \"FFmpeg decodifica el fixture\
        \ WebP animado; se ejecutará el E2E real.\"\nelse\n  echo \"SYNCIFY_ANIMATED_WEBP_E2E=0\" >> \"\
        $GITHUB_ENV\"\n  echo \"::warning::FFmpeg del runner no decodifica WebP animado; el E2E real se\
        \ omite explícitamente.\"\nfi\n"
    - name: Instalar toolchain Rust estable (con clippy y rustfmt)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache de artefactos cargo (workspace src-tauri)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: Construir frontend requerido por Tauri
      working-directory: ui
      run: npm ci && npm run build
    - name: cargo check --all-targets --locked
      run: cargo check --all-targets --locked
    - name: Suite de tests completa
      run: cargo test --locked
    - name: batch_50_audit_test serializado (--test-threads=1)
      timeout-minutes: 10
      run: cargo test --locked --test batch_50_audit_test -- --test-threads=1
    - name: cargo clippy estricto
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: cargo fmt --all -- --check
      run: cargo fmt --all -- --check
  frontend:
    needs: changed
    name: Frontend (ui · vue-tsc · vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: needs.changed.outputs.frontend != 'true'
      run: 'echo "Sin cambios en ui/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: needs.changed.outputs.frontend == 'true'
      uses: actions/checkout@v4
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: Instalar dependencias (npm ci, reproducible desde package-lock.json)
      run: npm ci
    - name: Chequeo de tipos Vue/TS (vue-tsc --noEmit)
      run: npx vue-tsc --noEmit
    - name: Tests unitarios (vitest run, modo CI)
      run: npm run test:run
  python:
    needs: changed
    name: Python (bridges · tests unitarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: needs.changed.outputs.python != 'true'
      run: 'echo "Sin cambios en scripts/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: needs.changed.outputs.python == 'true'
      uses: actions/checkout@v4
    - name: Configurar Python
      if: needs.changed.outputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Instalar dependencias de bridges
      if: needs.changed.outputs.python == 'true'
      run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
    - name: Suite unittest de scripts/
      if: needs.changed.outputs.python == 'true'
      run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
