# Primer pipeline de CI de Syncify.
# Tres jobs independientes en paralelo: Rust (src-tauri), Frontend (ui/) y smoke de sintaxis de los bridges Python (scripts/).
# Nota Deuda A12: los 2 tests de batch_50_audit_test se cuelgan >60 s en paralelo,
# por eso se excluyen del pase general y se re-ejecutan serializados (--test-threads=1).
# Los tests live-network están marcados #[ignore]: NO usamos --include-ignored.

name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Una corrida activa por rama/ref; un push nuevo cancela la corrida anterior de la misma ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (src-tauri · check · test · clippy · fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias nativas de Tauri (GTK y WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Comprobar capacidad FFmpeg para WebP animado
        shell: bash
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -decoders | grep -E 'webp(_anim)?' || true
          if ffmpeg -hide_banner -loglevel error \
            -i tests/fixtures/animated-cover.webp -f null -; then
            echo "SYNCIFY_ANIMATED_WEBP_E2E=1" >> "$GITHUB_ENV"
            echo "FFmpeg decodifica el fixture WebP animado; se ejecutará el E2E real."
          else
            echo "SYNCIFY_ANIMATED_WEBP_E2E=0" >> "$GITHUB_ENV"
            echo "::warning::FFmpeg del runner no decodifica WebP animado; el E2E real se omite explícitamente."
          fi

      - name: Instalar toolchain Rust estable (con clippy y rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache de artefactos cargo (workspace src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # generate_context! valida frontendDist durante la compilación de Rust.
      - name: Configurar Node.js 20 con cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Construir frontend requerido por Tauri
        working-directory: ui
        run: npm ci && npm run build

      # a) Compilación completa (lib + bins + tests) validando contra Cargo.lock comprometido.
      - name: cargo check --all-targets --locked
        run: cargo check --all-targets --locked

      # b) Suite completa EXCLUYENDO los 2 tests flaky conocidos (se cuelgan en paralelo, Deuda A12).
      - name: Suite de tests completa (sin los 2 flaky de batch_50)
        run: >
          cargo test --locked --
          --skip test_batch_50_pipeline_e2e_concurrency_and_forensic_audit
          --skip test_batch_health_check_detects_anomalies_and_staging_orphans

      # c) El binario flaky aparte, serializado: en un solo hilo no se cuelgan.
      - name: batch_50_audit_test serializado (--test-threads=1)
        run: cargo test --locked --test batch_50_audit_test -- --test-threads=1

      # d) Lint bloqueante y reproducible para todo el workspace.
      - name: cargo clippy estricto
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # e) Formato bloqueante para todo el workspace Rust.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  frontend:
    name: Frontend (ui · vue-tsc · vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 con cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Instalar dependencias (npm ci, reproducible desde package-lock.json)
        run: npm ci

      - name: Chequeo de tipos Vue/TS (vue-tsc --noEmit)
        run: npx vue-tsc --noEmit

      - name: Tests unitarios (vitest run, modo CI)
        run: npm run test:run

  python:
    name: Python (bridges · tests unitarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de bridges
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Suite unittest de scripts/
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
