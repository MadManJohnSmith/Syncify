name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed:
    name: Detectar areas afectadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deteccion y fallback viven en scripts/ci/resolve_areas.py (con su test):
    # dorny emite los strings "true"/"false" y en las expresiones de GitHub
    # cualquier string no vacio (incluido "false") es truthy, la trampa que
    # costo 5 commits de reparacion. Aqui solo viaja UN output, una lista
    # JSON que los tres jobs consultan por pertenencia exacta.
    # El workflow que ejecuta la familia es parte de cada area: tocar ci.yml
    # re-ejecuta la familia en las dos patas del matrix, la misma filosofia
    # fail-safe del fallback (correr todo antes que no correr nada).
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
    steps:
    - uses: actions/checkout@v4
    - id: filter
      uses: dorny/paths-filter@v3
      with:
        base: ${{ github.event.pull_request.base.sha || github.event.before }}
        ref: ${{ github.sha }}
        filters: "rust:\n  - 'src-tauri/**'\n  - 'crates/**'\n  - '.github/workflows/ci.yml'\nfrontend:\n  - 'ui/**'\n  - '.github/workflows/ci.yml'\npython:\n  - 'scripts/**'\n  - '.github/workflows/ci.yml'\n"
    - id: areas
      name: Resolver areas afectadas (fallback incluido)
      env:
        FILTER_RUST: ${{ steps.filter.outputs.rust }}
        FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        FILTER_PYTHON: ${{ steps.filter.outputs.python }}
      run: python3 scripts/ci/resolve_areas.py
  rust:
    name: Rust (src-tauri · check · test · clippy · fmt)
    needs: changed
    # La familia de verificacion corre en las dos patas (#268): la de Linux es
    # la hermana historica; la de Windows consume solo lo versionado (WebView2
    # en vez de webkit2gtk, herramientas de test desde el proveedor pineado).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'rust')"
      run: 'echo "Sin cambios en src-tauri/ ni crates/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
      uses: actions/checkout@v4
    # El incidente del 2026-11-07 (corrida 42216381025) murio a los 60
    # minutos descargando .deb de un mirror lento. Dos defensas baratas:
    # 1) Acquire::Retries: apt reintenta ante cortes transitorios del
    #    mirror en vez de abortar la corrida con el primer fallo de red.
    # 2) cache de /var/cache/apt/archives: los .deb ya descargados se
    #    reutilizan en la siguiente corrida y apt los verifica contra el
    #    indice (uno alterado o desfasado se vuelve a descargar). La
    #    lista de paquetes vive en el paso de instalacion de este mismo
    #    fichero, asi que el hash de ci.yml es su proxy: editar la lista
    #    invalida la cache; editar cualquier otra parte del workflow
    #    tambien (conservador, a cambio de una clave unica y sin estado).
    - name: Reintentos de apt ante un mirror lento (Acquire::Retries)
      run: 'echo "Acquire::Retries \"5\";" | sudo tee /etc/apt/apt.conf.d/80-retries'
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Linux'
    - name: Cache de paquetes apt descargados
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-v1-${{ runner.os }}-${{ hashFiles('**/ci.yml') }}
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Linux'
    - name: Instalar dependencias nativas de Tauri (GTK y WebKit2GTK)
      run: "sudo apt-get update\nsudo apt-get install -y \\\n  ffmpeg \\\n  flac \\\n  libasound2-dev \\\n  libwebkit2gtk-4.1-dev \\\n  libgtk-3-dev \\\n  libayatana-appindicator3-dev \\\n  librsvg2-dev\n"
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Linux'
    # En Windows Tauri usa WebView2 (no webkit2gtk): check/clippy/test no
    # necesitan dependencias GTK. Las herramientas de test (ffmpeg/ffprobe/
    # fpcalc/flac) no vienen de un gestor de paquetes sino del proveedor
    # pineado del arbol (scripts/dependency_manager.py, SHA-256 verificado),
    # la misma tabla que consumen los builds de release.
    - name: Configurar Python 3.11 (host CI para el proveedor de pines)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Descargar y colocar herramientas pineadas (ffmpeg, ffprobe, fpcalc, flac)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python scripts/dependency_manager.py place-external --triple x86_64-pc-windows-msvc
        python scripts/dependency_manager.py install flac
    # El overlay de empaquetado de Windows (tauri.windows.conf.json) declara
    # el runtime Python embebido como recurso (../python/**/*); el build.rs de
    # tauri aborta si el glob no matchea nada. La familia de verificacion no
    # ejecuta la app: basta un marcador explicito, y asi el arbol sigue sin
    # runtime empaquetado (la higiene de cmd_utils_test lo vigila y los
    # builds de release montan el runtime real con install-runtime).
    - name: Marcador del recurso python/ que exige el overlay de Windows
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        mkdir -p python
        printf 'Marcador de CI: tauri-build exige que el glob ../python/**/* matchee. El runtime real lo monta dependency_manager.py install-runtime en los builds de release (build-windows.yml).\n' > python/CI-RESOURCE-PLACEHOLDER.txt
        ls -la python/
    - name: Herramientas pineadas en PATH
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        for tool in ffmpeg ffprobe fpcalc flac; do
          dir="$(python -c "import sys; sys.path.insert(0, 'scripts'); import dependency_manager; p = dependency_manager.get_tool_path('$tool'); print(p.parent if p else '')")"
          if [ -z "$dir" ]; then
            echo "::error::Herramienta $tool no encontrada en bin/ tras el proveedor"
            exit 1
          fi
          echo "$dir" >> "$GITHUB_PATH"
          echo "$tool -> $dir"
        done
    - name: Comprobar ejecutable FLAC requerido por tests
      run: flac --version
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Comprobar capacidad FFmpeg para WebP animado
      shell: bash
      run: "ffmpeg -version\nffmpeg -hide_banner -decoders | grep -E 'webp(_anim)?' || true\nif ffmpeg -hide_banner -loglevel error \\\n  -i tests/fixtures/animated-cover.webp -f null -; then\n  echo \"\
        SYNCIFY_ANIMATED_WEBP_E2E=1\" >> \"$GITHUB_ENV\"\n  echo \"FFmpeg decodifica el fixture WebP animado; se ejecutará el E2E real.\"\nelse\n  echo \"SYNCIFY_ANIMATED_WEBP_E2E=0\" >> \"$GITHUB_ENV\"\
        \n  echo \"::warning::FFmpeg del runner no decodifica WebP animado; el E2E real se omite explícitamente.\"\nfi\n"
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Instalar toolchain Rust fijado 1.98.1 (con clippy y rustfmt)
      uses: dtolnay/rust-toolchain@1.98.1
      with:
        components: clippy, rustfmt
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Cache de artefactos cargo (workspace src-tauri)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        # Aislamiento explicito de las dos patas del matrix: target/debug
        # contiene artefactos MSVC en Windows y ELF en Linux; que no se
        # crucen aunque la accion ya separe por OS.
        key: ${{ runner.os }}
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: Construir frontend requerido por Tauri
      working-directory: ui
      run: npm ci && npm run build
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: cargo check --all-targets --locked
      run: cargo check --all-targets --locked
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    # Los exe de test no llevan el manifiesto que tauri-build embebe en el
    # binario de la app: el loader de Windows resuelve comctl32 v5 y mueren al
    # cargar (STATUS_ENTRYPOINT_NOT_FOUND) por imports que solo existen en v6
    # (SetWindowSubclass y compania, via tao/wry). Mismo problema y misma cura
    # que la guardia del keyring en build-windows.yml: compilar sin ejecutar,
    # embeber el manifiesto v6 con mt.exe en cada exe de deps/ y correr.
    - name: Compilar binarios de test sin ejecutar (base del manifiesto comctl32)
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      run: cargo test --locked --no-run
    - name: Embeber manifiesto comctl32 v6 en los exe de test
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust') && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $mt) { throw "mt.exe no encontrado en Windows Kits" }
        Write-Host "mt: $($mt.FullName)"
        $manifest = Join-Path $env:RUNNER_TEMP "comctl32-v6.manifest"
        $manifestLines = @(
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">'
          '  <dependency>'
          '    <dependentAssembly>'
          '      <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/>'
          '    </dependentAssembly>'
          '  </dependency>'
          '</assembly>'
        )
        $manifestLines | Set-Content -Encoding UTF8 $manifest
        # El target/ del workspace vive en la raiz del repo, no en src-tauri/.
        $deps = Join-Path $env:GITHUB_WORKSPACE "target\debug\deps"
        $patched = 0
        Get-ChildItem -Path $deps -Filter "*.exe" | ForEach-Object {
          & $mt.FullName -manifest $manifest -outputresource:"$($_.FullName);#1" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mt.exe fallo con $($_.Name)" }
          $patched++
        }
        Write-Host "Manifiesto embebido en $patched exe de test"
    - name: Suite de tests completa
      # --no-fail-fast (el comando canonico del AGENTS.md): un binario de test
      # que falle no tapa el resultado de los demas, la evidencia es completa
      # por corrida en las dos patas del matrix.
      run: cargo test --locked --no-fail-fast
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: batch_50_audit_test serializado (--test-threads=1)
      timeout-minutes: 10
      run: cargo test --locked --test batch_50_audit_test -- --test-threads=1
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: cargo clippy estricto
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
    - name: cargo fmt --all -- --check
      run: cargo fmt --all -- --check
      if: contains(fromJSON(needs.changed.outputs.areas), 'rust')
  frontend:
    needs: changed
    name: Frontend (ui · vue-tsc · vitest)
    # Mismo matrix que la familia rust (#268): la UI y su suite son
    # cross-platform (Node/Vitest/Vue-tsc), no hay pasos por OS.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'frontend')"
      run: 'echo "Sin cambios en ui/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
      uses: actions/checkout@v4
    - name: Configurar Node.js 20 con cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Instalar dependencias (npm ci, reproducible desde package-lock.json)
      run: npm ci
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Chequeo de tipos Vue/TS (vue-tsc --noEmit)
      run: npx vue-tsc --noEmit
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
    - name: Tests unitarios (vitest run, modo CI)
      run: npm run test:run
      if: contains(fromJSON(needs.changed.outputs.areas), 'frontend')
  python:
    needs: changed
    name: Python (bridges · tests unitarios)
    # Mismo matrix que la familia rust (#268): la suite ya declara sus casos
    # POSIX con skipIf(IS_WINDOWS) y las dependencias tienen ruedas Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Area sin cambios
      working-directory: ${{ github.workspace }}
      if: "!contains(fromJSON(needs.changed.outputs.areas), 'python')"
      run: 'echo "Sin cambios en scripts/: no hay nada que probar."

        echo "El job aparece en verde para no bloquear el merge, pero no ejecuto nada."

        '
    - name: Checkout del repositorio
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      uses: actions/checkout@v4
    - name: Configurar Python
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      uses: actions/setup-python@v5
      with:
        # La misma 3.11.x que empaquetan los builds de release: lo que CI
        # testea debe ser el runtime que se publica. Flotante dentro de 3.11:
        # el manifest de setup-python no trae el parche exacto 3.11.9 para el
        # runner nuevo (Ubuntu 26.04); la verificación exacta del runtime
        # publicado llega con #242 y sus smokes sobre el Python empaquetado.
        python-version: '3.11'
    - name: Instalar dependencias de bridges
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
    - name: Suite unittest de scripts/
      if: contains(fromJSON(needs.changed.outputs.areas), 'python')
      run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
