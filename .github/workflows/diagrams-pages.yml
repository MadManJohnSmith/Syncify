name: diagrams-pages

'on':
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - '.github/workflows/diagrams-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # upload-pages-artifact sirve su contenido en la raíz del sitio; copiar
      # con la estructura del repo para que las URLs mantengan /docs/diagrams/
      # (así las enlazan las README).
      - run: mkdir -p site/docs && cp -r docs/diagrams site/docs/diagrams
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
