[package]
name = "syncify-core-domain"
version = "0.1.0"
edition = "2021"
description = "Pure domain contracts, quality policies, validators, manifest, and typed progress states for Syncify"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
