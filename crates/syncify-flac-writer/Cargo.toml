[package]
name = "syncify-flac-writer"
version = "0.1.0"
edition = "2021"
description = "Non-destructive FLAC VorbisComments and METADATA_BLOCK_PICTURE writer with animated WebP preservation for Syncify"

[dependencies]
metaflac = "0.2"
md5 = "0.7"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syncify-core-domain = { path = "../syncify-core-domain" }
syncify-lyrics-domain = { path = "../syncify-lyrics-domain" }
syncify-metadata-domain = { path = "../syncify-metadata-domain" }
