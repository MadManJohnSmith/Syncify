[package]
name = "syncify-tauri"
version = "0.1.0"
edition = "2021"
description = "Syncify Tauri application"
default-run = "syncify-tauri"

[lib]
name = "syncify_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
opener = { version = "0.8", features = ["reveal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
chrono = "0.4"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
keyring = "3"
dirs = "5"
hostname = "0.4"
futures = "0.3"
futures-util = "0.3"
lazy_static = "1.5"
metaflac = "0.2"
sysinfo = "0.30"
walkdir = "2.5"
md5 = "0.8.0"
flate2 = "1.0"
regex = "1.10"
syncify-core-domain = { path = "../crates/syncify-core-domain" }
syncify-flac-writer = { path = "../crates/syncify-flac-writer" }
syncify-lyrics-domain = { path = "../crates/syncify-lyrics-domain" }
syncify-metadata-domain = { path = "../crates/syncify-metadata-domain" }
syncify-tidal-downloader = { path = "../crates/syncify-tidal-downloader" }



[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
