[package]
name = "syncify-tauri"
version = "0.2.1"
edition = "2021"
description = "Syncify Tauri application"
default-run = "syncify-tauri"

[lib]
name = "syncify_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
opener = { version = "0.8", features = ["reveal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
chrono = "0.4"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
# sync-secret-service (y NO linux-native): el keyring del kernel es por
# sesión y no persiste entre arranques. Con el backend por defecto, la app
# guardaba la clave "con éxito" y al siguiente arranque no la encontraba,
# generaba otra y marcaba TODAS las cuentas como credenciales irrecuperables.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
dirs = "5"
libc = "0.2"
hostname = "0.4"
futures = "0.3"
futures-util = "0.3"
lazy_static = "1.5"
metaflac = "0.2"
sysinfo = "0.30"
walkdir = "2.5"
md5 = "0.8.0"
flate2 = "1.0"
regex = "1.10"
mp4ameta = "0.13"
syncify-core-domain = { path = "../crates/syncify-core-domain" }
syncify-flac-writer = { path = "../crates/syncify-flac-writer" }
syncify-lyrics-domain = { path = "../crates/syncify-lyrics-domain" }
syncify-metadata-domain = { path = "../crates/syncify-metadata-domain" }
syncify-tidal-downloader = { path = "../crates/syncify-tidal-downloader" }



[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
# The lyrics domain `fixtures` module is only for tests; this dev-only feature keeps
# the deterministic sample payloads out of production builds (resolver v2 does not
# unify dev-dependency features into normal dependency builds).
syncify-lyrics-domain = { path = "../crates/syncify-lyrics-domain", features = ["test-fixtures"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_borrows_for_generic_args = "allow"
await_holding_lock = "allow"
needless_range_loop = "allow"
ptr_arg = "allow"
bool_assert_comparison = "allow"
manual_range_contains = "allow"
manual_is_multiple_of = "allow"
unnecessary_cast = "allow"
match_like_matches_macro = "allow"
manual_repeat_n = "allow"
useless_vec = "allow"
items_after_test_module = "allow"
field_reassign_with_default = "allow"
needless_update = "allow"
suspicious_open_options = "allow"
if_same_then_else = "allow"
manual_clamp = "allow"
redundant_pattern_matching = "allow"
doc_lazy_continuation = "allow"
assertions_on_constants = "allow"
derivable_impls = "allow"
useless_conversion = "allow"
needless_borrow = "allow"
useless_asref = "allow"
unnecessary_map_or = "allow"
needless_as_bytes = "allow"
