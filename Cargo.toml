[package]
name = "syncify-core"
version = "0.1.0"
edition = "2021"
description = "Syncify music library orchestrator - Rust core"
authors = ["MadManJohnSmith"]

[dependencies]
# SQLite database with async support
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Note: tauri will be added during /hook-ui workflow

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true

